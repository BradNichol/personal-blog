name: CI

on:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f public/index.html
      - run: test -f public/contact/index.html
      - run: test -f public/styles.css
      - run: test -f public/robots.txt
      - run: test -f public/sitemap.xml
      - run: test -f skills/publish-recent-work/SKILL.md
      - run: test -f skills/publish-recent-work/agents/openai.yaml
      - run: test -x scripts/activity/setup-local.sh
      - run: bash -n scripts/activity/setup-local.sh
      - run: node --test tests/recent-work.test.mjs
      - run: node --test tests/activity-pipeline.test.mjs
      - run: node --test tests/github-extractor.test.mjs
      - run: node --test tests/local-publish.test.mjs
      - run: node --check scripts/activity/contract.mjs
      - run: node --check scripts/activity/eligibility.mjs
      - run: node --check scripts/activity/model.mjs
      - run: node --check scripts/activity/text.mjs
      - run: node --check scripts/activity/index.mjs
      - run: node --check scripts/activity/github.mjs
      - run: node --check scripts/activity/cli.mjs
      - run: node --check scripts/activity/commit.mjs
      - run: node --check scripts/activity/config.mjs
      - run: node --check scripts/activity/prepare.mjs
      - run: node --check scripts/activity/finalize.mjs
