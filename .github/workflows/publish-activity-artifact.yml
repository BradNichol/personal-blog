name: Publish activity artifact

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    # This permission is only for committing the already-sanitized public
    # artifact. Private GitHub ingestion uses the separate read-only secret.
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ACTIVITY_AUTHOR_LOGIN: ${{ secrets.ACTIVITY_AUTHOR_LOGIN }}
      ACTIVITY_DENYLIST: ${{ secrets.ACTIVITY_DENYLIST }}
      ACTIVITY_GITHUB_TOKEN: ${{ secrets.ACTIVITY_GITHUB_TOKEN }}
      ACTIVITY_GITHUB_TOKEN_POLICY: ${{ secrets.ACTIVITY_GITHUB_TOKEN_POLICY }}
      ACTIVITY_MODEL_API_KEY: ${{ secrets.ACTIVITY_MODEL_API_KEY }}
      ACTIVITY_MODEL_ENDPOINT: ${{ secrets.ACTIVITY_MODEL_ENDPOINT }}
      ACTIVITY_MODEL_POLICY: ${{ secrets.ACTIVITY_MODEL_POLICY }}
      ACTIVITY_MODEL_PROVIDER: ${{ secrets.ACTIVITY_MODEL_PROVIDER }}
      ACTIVITY_REPOSITORIES: ${{ secrets.ACTIVITY_REPOSITORIES }}
    steps:
      - name: Check out the public site
        uses: actions/checkout@v4

      - name: Produce the validated artifact
        run: node scripts/activity/publish.mjs

      - name: Commit the sanitized artifact
        run: |
          if git diff --quiet -- public/data/recent-work.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/recent-work.json
          git commit -m "chore: refresh recent work artifact"
          git push
